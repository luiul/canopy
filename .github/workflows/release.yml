name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -ldflags "-X main.version=${VERSION}" -o dist/canopy ./cmd/canopy
          tar -C dist -czf dist/canopy-${GITHUB_REF_NAME}-darwin-$(go env GOARCH).tar.gz canopy
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
